<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Flight Search</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container">

  <header class="header">
    <h1>✈ Flight Search</h1>
    <p class="subtitle">
      Find available flights by selecting departure and arrival airports.
    </p>
  </header>

  <section class="card">

    <h2>Search Criteria</h2>

    <div class="form-wrapper">

      <form method="post" th:action="@{/filters}">

        <div class="form-group">
          <label for="airportOut">Departure Airport</label>

          <select id="airportOut" name="airport_out">
            <option value="">-- Select departure airport --</option>

            <option
                    th:each="airport : ${airports}"
                    th:value="${airport.code}"
                    th:text="${airport.name}"
                    th:selected="${airport.code == currentAirportOut}">
            </option>

          </select>
        </div>

        <div class="form-group">
          <label for="airportIn">Arrival Airport</label>

          <select id="airportIn" name="airport_in">
            <option value="">-- Select arrival airport --</option>

            <option
                    th:each="airport : ${airports}"
                    th:value="${airport.code}"
                    th:text="${airport.name}"
                    th:selected="${airport.code == currentAirportIn}">
            </option>

          </select>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn">
            🔍 Search Flights
          </button>
        </div>

      </form>

    </div>

  </section>

  <section class="card" th:if="${flying != null}">

    <h2>Search Results</h2>

    <form th:action="@{/user/book}" method="post">

      <div class="table-wrapper">

        <table>

          <thead>

          <tr>
            <th>Select</th>
            <th>From</th>
            <th>To</th>
            <th>Departure</th>
            <th>Flight No.</th>
          </tr>

          </thead>

          <tbody>

          <tr th:if="${#lists.isEmpty(flying)}">
            <td colspan="5" class="empty-message">
              No flights found for the selected route.
            </td>
          </tr>

          <tr th:each="flight : ${flying}">

            <td>

              <input
                      type="checkbox"
                      name="flightIds"
                      th:value="${flight.flightId}"
                      th:disabled="${loggedInUser == null}"/>

            </td>

            <td th:text="${flight.departureAirport}"></td>

            <td th:text="${flight.arrivalAirport}"></td>

            <td th:text="${flight.scheduledDeparture}"></td>

            <td th:text="${flight.flightNo}"></td>

          </tr>

          </tbody>

        </table>

      </div>

      <div class="button-row">

        <a th:href="@{/}" class="btn btn-secondary">
          ← Main Page
        </a>

        <button
                type="submit"
                class="btn"
                th:if="${loggedInUser != null}">
          ✈ Book Selected Flights
        </button>

      </div>

      <div
              class="message"
              th:if="${loggedInUser == null}">

        Please log in to book selected flights.

      </div>

    </form>

  </section>

  <div
          class="pagination"
          th:if="${maxCountFlying > 1}">

    <div class="pagination-inner">

      <a
              th:if="${currentPage > 1}"
              th:href="@{/filters(page=${currentPage - 1}, airport_out=${currentAirportOut}, airport_in=${currentAirportIn})}">
        Previous
      </a>

      <span>
                Page
                <strong th:text="${currentPage}"></strong>
                of
                <strong th:text="${maxCountFlying}"></strong>
            </span>

      <a
              th:if="${currentPage < maxCountFlying}"
              th:href="@{/filters(page=${currentPage + 1}, airport_out=${currentAirportOut}, airport_in=${currentAirportIn})}">
        Next
      </a>

    </div>

  </div>

  <footer>
    &copy; 2025–2026 Airport System
  </footer>

</div>

</body>
</html>

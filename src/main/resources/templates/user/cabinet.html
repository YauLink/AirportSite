<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>User Cabinet</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

  <header class="header">
    <h1>👤 User Cabinet</h1>
    <div class="actions">
      <a th:href="@{/user/logout}" class="btn btn-danger">Logout</a>
    </div>
  </header>

  <h2>
    Welcome,
    <span th:text="${fullName}">User</span>
  </h2>

  <div class="table-wrapper">

    <table>

      <thead>
      <tr>
        <th>Ticket No</th>
        <th>Booking Ref</th>
        <th>Flight ID</th>
        <th>Fare</th>
        <th>Amount</th>
      </tr>
      </thead>

      <tbody>

      <tr th:if="${#lists.isEmpty(ticketFlights)}">
        <td colspan="5" class="empty-message">
          You don't have any tickets.
        </td>
      </tr>

      <tr th:each="tf : ${ticketFlights}">
        <td th:text="${tf.ticket.ticketNo}"></td>
        <td th:text="${tf.ticket.booking.bookRef}"></td>
        <td th:text="${tf.id.flightId}"></td>
        <td th:text="${tf.fareConditions}"></td>
        <td th:text="${tf.amount}"></td>
      </tr>

      </tbody>
    </table>
  </div>
</div>
</body>
</html>

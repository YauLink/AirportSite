<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Confirm Booking</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

  <header class="header">
    <h1>✅ Confirm Booking</h1>
  </header>

  <h3>
    Passenger:
    <span th:text="${passengerName}"></span>
  </h3>

  <div class="table-wrapper">
    <table>
      <thead>
      <tr>
        <th>Flight No</th>
        <th>Departure</th>
        <th>Arrival</th>
        <th>Departure Time</th>
        <th>Arrival Time</th>
        <th>Status</th>
        <th>Aircraft</th>
      </tr>
      </thead>

      <tbody>

      <tr th:if="${#lists.isEmpty(flights)}">
        <td colspan="7" class="empty-message">
          No flights selected.
        </td>
      </tr>

      <tr th:each="flight : ${flights}">
        <td th:text="${flight.flightNo}"></td>
        <td th:text="${flight.departureAirport}"></td>
        <td th:text="${flight.arrivalAirport}"></td>
        <td th:text="${flight.scheduledDeparture}"></td>
        <td th:text="${flight.scheduledArrival}"></td>
        <td th:text="${flight.status}"></td>
        <td th:text="${flight.aircraftCode}"></td>
      </tr>

      </tbody>
    </table>
  </div>

  <div class="form-wrapper">

    <form th:action="@{/user/book}" method="post">

      <div th:each="flight : ${flights}">
        <input type="hidden"
               name="flightIds"
               th:value="${flight.flightId}">
      </div>

      <div class="button-row">

        <div class="button-left">
          <a th:href="@{/filters}" class="btn">
            ← Back
          </a>
        </div>

        <div class="button-center">
          <button type="submit" class="btn">
            Confirm Booking
          </button>
        </div>

        <div></div>
      </div>
    </form>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Manage Flights</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

  <header class="header">
    <h1>✈ Manage Flights</h1>
    <div class="actions">
      <a th:href="@{/admin/flights/create}" class="btn">+ Create Flight</a>
      <a th:href="@{/admin/dashboard}" class="btn">Dashboard</a>
    </div>
  </header>

  <div class="table-wrapper">
    <table>
      <thead>
      <tr>
        <th>#</th>
        <th>Flight No</th>
        <th>Departure</th>
        <th>Arrival</th>
        <th>Status</th>
        <th class="actions-column">Actions</th>
      </tr>
      </thead>

      <tbody>

      <tr th:if="${#lists.isEmpty(flights)}">
        <td colspan="6" class="empty-message">
          No flights available.
        </td>
      </tr>

      <tr th:each="flight, iterStat : ${flights}">
        <td th:text="${iterStat.count}"></td>
        <td th:text="${flight.flightNo}"></td>
        <td th:text="${flight.departureAirport}"></td>
        <td th:text="${flight.arrivalAirport}"></td>
        <td th:text="${flight.status}"></td>

        <td class="actions">

          <a th:href="@{/admin/flights/edit/{id}(id=${flight.flightId})}"
             class="btn">
            Edit
          </a>

          <form th:action="@{/admin/flights/delete/{id}(id=${flight.flightId})}"
                method="post"
                style="display:inline; margin:0; padding:0; background:none; box-shadow:none;">

            <button type="submit"
                    class="btn btn-danger"
                    onclick="return confirm('Delete this flight?')">
              Delete
            </button>

          </form>

        </td>
      </tr>

      </tbody>
    </table>
  </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Select Seat</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <header class="header">
        <h1>💺 Select Seat</h1>
    </header>

    <div class="form-wrapper">

        <div class="error" th:if="${error}" th:text="${error}"></div>
        <div class="success" th:if="${success}" th:text="${success}"></div>

        <form th:action="@{'/bookings/assign/' + ${bookingRef}}" method="post">

            <div class="form-group">
                <label>Available Seats</label>

                <select name="seatNo" th:disabled="${#lists.isEmpty(seats)}">

                    <option th:each="seat : ${seats}"
                            th:value="${seat.seatNo}"
                            th:text="${seat.seatNo}">
                    </option>

                </select>

            </div>

            <p th:if="${#lists.isEmpty(seats)}">
                No seats are currently available for this flight.
            </p>

            <div class="button-row">

                <div class="button-left">
                    <a th:href="@{/bookings/list}"
                       class="btn">
                        ← Back
                    </a>
                </div>

                <div class="button-center">
                    <button type="submit"
                            class="btn"
                            th:disabled="${#lists.isEmpty(seats)}">
                        Confirm Seat
                    </button>
                </div>

                <div></div>

            </div>

        </form>

    </div>
</div>
</body>
</html>

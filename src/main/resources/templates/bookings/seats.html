<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Select Seat</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <header class="header">
        <h1>💺 Select Seat</h1>
    </header>

    <div class="form-wrapper">

        <form th:action="@{/bookings/assign}" method="post">

            <input type="hidden"
                   name="bookingRef"
                   th:value="${bookingRef}">

            <input type="hidden"
                   name="flightId"
                   th:value="${flightId}">

            <div class="form-group">
                <label>Available Seats</label>

                <select name="seatNo">

                    <option th:each="seat : ${seats}"
                            th:value="${seat.seatNo}"
                            th:text="${seat.seatNo}">
                    </option>

                </select>

            </div>

            <div class="button-row">

                <div class="button-left">
                    <a th:href="@{/bookings/list}"
                       class="btn">
                        ← Back
                    </a>
                </div>

                <div class="button-center">
                    <button type="submit"
                            class="btn">
                        Confirm Seat
                    </button>
                </div>

                <div></div>

            </div>

        </form>

        <div class="error"
             th:if="${error}"
             th:text="${error}">
        </div>
    </div>
</div>
</body>
</html>

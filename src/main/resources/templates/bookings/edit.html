<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Booking</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

  <header class="header">
    <h1>📖 Edit Booking</h1>
  </header>

  <div class="form-wrapper">

    <form th:action="@{'/bookings/update/' + ${booking.bookRef}}"
          th:object="${booking}"
          method="post">

      <div class="form-group">
        <label>Booking Reference</label>
        <input type="text"
               th:field="*{bookRef}"
               readonly>
      </div>

      <div class="form-group">
        <label>Booking Date</label>
        <input type="datetime-local"
               th:value="${#temporals.format(booking.bookDate,'yyyy-MM-dd''T''HH:mm')}"
               name="bookDate">
      </div>

      <div class="form-group">
        <label>Total Amount</label>
        <input type="number"
               step="0.01"
               th:field="*{totalAmount}">
      </div>

      <div class="button-row">

        <div class="button-left">
          <a th:href="@{/bookings/list}" class="btn">
            ← Back
          </a>
        </div>

        <div class="button-center">
          <button type="submit" class="btn">
            Update Booking
          </button>
        </div>
        <div></div>
      </div>
    </form>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Ticket</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

  <header class="header">
    <h1>🎫 Edit Ticket</h1>
  </header>

  <div class="form-wrapper">

    <form th:action="@{'/tickets/' + ${ticket.ticketNo} + '/update'}"
          th:object="${ticket}"
          method="post">

      <div class="form-group">
        <label for="passengerName">Passenger Name</label>
        <input id="passengerName"
               type="text"
               th:field="*{passengerName}">
      </div>

      <div class="form-group">
        <label for="contactData">Contact Data</label>
        <input id="contactData"
               type="text"
               th:field="*{contactData}">
      </div>

      <div class="button-row">

        <div class="button-left">
          <a th:href="@{/tickets}" class="btn">
            ← Back
          </a>
        </div>

        <div class="button-center">
          <button type="submit" class="btn">
            Update Ticket
          </button>
        </div>

      </div>

    </form>

    <div class="button-row delete-row">
      <div></div>

      <div class="button-right">
        <form th:action="@{'/tickets/' + ${ticket.ticketNo} + '/delete'}"
              method="post">

          <button type="submit"
                  class="btn btn-danger"
                  onclick="return confirm('Delete this ticket?')">
            Delete Ticket
          </button>

        </form>
      </div>
    </div>

  </div>

</div>

</body>
</html>

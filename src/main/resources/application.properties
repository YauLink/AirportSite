spring.application.name=Airports

server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/demo
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.test.mockbean.replace-with-mock.enabled=true
spring.mvc.format.date-time=yyyy-MM-dd'T'HH:mm

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
user-management.auth-url=${USER_MANAGEMENT_AUTH_URL:http://localhost:8083/api/auth/login}
security.login.max-failures=5
security.login.window-ms=900000
